name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Browser/package-lock.json
      - run: npm ci
      - run: npm run build

  websocket-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WebSocketServer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: WebSocketServer/package-lock.json
      - run: npm ci

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Verify usable state (SPM + Xcode + Browser + WebSocket)
        run: ./scripts/verify.sh
